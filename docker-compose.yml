# SQL Server para desenvolvimento e testes (edição Developer, gratuita).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: partners-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "P@rtners2026"
    ports:
      - "1433:1433"
